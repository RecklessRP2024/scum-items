<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Item-Liste</title>
  <style>
    :root { color-scheme: dark; --bg:#101211; --panel:#191c1a; --line:#353a36; --text:#e8ebe7; --muted:#8e968f; --accent:#d9392f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif; background:linear-gradient(#0006,#0006),repeating-linear-gradient(135deg,#141714 0 2px,#111311 2px 8px); color:var(--text); }
    main { width:min(1120px,calc(100% - 28px)); margin:auto; padding:34px 0; }
    header { display:flex; gap:20px; align-items:end; justify-content:space-between; margin-bottom:18px; padding:0 0 14px 13px; border-bottom:1px solid var(--line); border-left:4px solid var(--accent); }
    h1 { margin:0 0 2px; font-size:clamp(24px,4vw,34px); font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    header p { margin:0; color:var(--muted); font-size:12px; letter-spacing:.04em; }
    input { width:min(280px,100%); padding:9px 11px; border:1px solid var(--line); border-radius:2px; background:#141615; color:var(--text); outline:none; }
    input:focus { border-color:var(--accent); box-shadow:inset 3px 0 var(--accent); }
    .tabs { display:flex; gap:5px; margin:0 0 12px; padding-bottom:8px; overflow-x:auto; scrollbar-width:thin; }
    .tabs button { flex:none; padding:7px 12px; border:1px solid var(--line); border-radius:2px; background:#181b19; color:var(--muted); cursor:pointer; font:700 11px/1 system-ui,sans-serif; letter-spacing:.07em; text-transform:uppercase; }
    .tabs button:hover { color:var(--text); border-color:#666d67; }
    .tabs button.active { color:#fff; border-color:var(--accent); background:linear-gradient(90deg,var(--accent) 0 3px,#272a28 3px); }
    #items { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr)); align-items:stretch; gap:8px; }
    .card { display:grid; grid-template-columns:48px minmax(0,1fr); align-items:start; gap:10px; min-width:0; padding:10px; border:1px solid #303531; border-left:3px solid #454b46; border-radius:2px; background:linear-gradient(110deg,#1e211f,#171918); box-shadow:0 5px 12px #0004; transition:border-color .15s,transform .15s; }
    .card > div:last-child { min-width:0; }
    .card:hover { border-left-color:var(--accent); transform:translateY(-1px); }
    .icon { width:48px; height:48px; display:grid; place-items:center; border:1px solid #3a403b; border-radius:1px; background:#111311; font-size:25px; cursor:zoom-in; overflow:hidden; }
    .icon:hover,.icon:focus-visible { border-color:var(--accent); outline:none; }
    .icon img { width:100%; height:100%; object-fit:cover; }
    h2 { margin:0 0 6px; font-size:14px; line-height:1.25; letter-spacing:.035em; overflow-wrap:anywhere; text-transform:uppercase; }
    .row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:8px; min-width:0; padding:5px 0; border-top:1px solid #303431; }
    .row > div { min-width:0; }
    .label { display:inline; margin-right:5px; color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.08em; }
    code { display:inline; color:#c7cdc7; font-size:11px; line-height:1.35; white-space:normal; overflow-wrap:anywhere; word-break:break-word; }
    .card button { flex:none; width:25px; height:23px; padding:0; border:1px solid #3c423d; border-radius:2px; background:#262a27; color:#cfd4cf; cursor:pointer; font-size:0; }
    .card button::after { content:"⧉"; font-size:15px; }
    .card button:hover { border-color:var(--accent); background:var(--accent); color:#fff; }
    #empty { display:none; color:var(--muted); text-align:center; padding:50px; }
    #toast { position:fixed; left:50%; bottom:24px; translate:-50% 20px; padding:9px 14px; border:1px solid #555; border-left:3px solid var(--accent); border-radius:2px; background:#202320; color:#fff; opacity:0; transition:.2s; pointer-events:none; font-weight:700; }
    #toast.show { opacity:1; translate:-50% 0; }
    .lightbox { position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:28px; background:#000d; backdrop-filter:blur(5px); }
    .lightbox.open { display:grid; }
    .lightbox-panel { position:relative; display:grid; place-items:center; width:min(700px,92vw); min-height:min(560px,78vh); padding:42px 28px 28px; border:1px solid #414742; border-left:4px solid var(--accent); background:#151816; box-shadow:0 24px 80px #000; }
    .lightbox-content { display:grid; place-items:center; max-width:100%; max-height:68vh; font-size:clamp(110px,28vw,260px); line-height:1; }
    .lightbox-content img { display:block; max-width:100%; max-height:68vh; object-fit:contain; }
    .lightbox-title { position:absolute; left:18px; top:14px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
    .lightbox-close { position:absolute; right:12px; top:10px; width:30px; height:30px; border:1px solid #4b514c; border-radius:2px; background:#242825; color:#fff; cursor:pointer; font-size:20px; line-height:1; }
    .lightbox-close:hover,.lightbox-close:focus-visible { border-color:var(--accent); background:var(--accent); outline:none; }
    @media(max-width:620px){ header{align-items:stretch;flex-direction:column} input{width:100%} main{padding-top:22px} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Item Database</h1><p>Survival inventory // Name oder Spawnname kopieren</p></div>
      <input id="search" type="search" placeholder="Items durchsuchen …" aria-label="Items durchsuchen">
    </header>
    <nav id="tabs" class="tabs" aria-label="Item-Kategorien"></nav>
    <section id="items"></section>
    <div id="empty">Keine passenden Items gefunden.</div>
  </main>
  <div id="toast" role="status">Kopiert!</div>
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
    <div class="lightbox-panel">
      <span id="lightbox-title" class="lightbox-title"></span>
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Bildvorschau schließen">×</button>
      <div id="lightbox-content" class="lightbox-content"></div>
    </div>
  </div>

    const list = document.querySelector("#items");
    const tabs = document.querySelector("#tabs");
    const search = document.querySelector("#search");
    const empty = document.querySelector("#empty");
    const toast = document.querySelector("#toast");
    const lightbox = document.querySelector("#lightbox");
    const lightboxContent = document.querySelector("#lightbox-content");
    const lightboxTitle = document.querySelector("#lightbox-title");
    const lightboxClose = document.querySelector("#lightbox-close");
    let activeCategory = "Alles";
    let toastTimer;

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    }

    function renderTabs() {
      const categoryOrder = ["Kleidung", "Waffen", "Fahrzeuge", "Essen", "Fischen", "Herstellen", "Medizin", "Sonstiges", "NPC"];
      const available = new Set(items.flatMap(item => item.categories));
      const categories = ["Alles", ...categoryOrder.filter(category => available.has(category))];
      tabs.innerHTML = categories.map(category => `<button type="button" class="${category === activeCategory ? "active" : ""}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`).join("");
    }

    function render(query = search.value) {
      const term = query.trim().toLocaleLowerCase("de");
      const filtered = items.filter(item =>
        (activeCategory === "Alles" || item.categories.includes(activeCategory)) &&
        `${item.name} ${item.spawn}`.toLocaleLowerCase("de").includes(term)
      );
      list.innerHTML = filtered.map((item, index) => `
        <article class="card">
          <div class="icon" role="button" tabindex="0" aria-label="Bild von ${escapeHtml(item.name)} vergrößern" data-image="${escapeHtml(item.image)}" data-title="${escapeHtml(item.name)}">${/^https?:|^data:image\//i.test(item.image) ? `<img src="${escapeHtml(item.image)}" alt="">` : escapeHtml(item.image)}</div>
          <div>
            <h2>${escapeHtml(item.name)}</h2>
            <div class="row"><div><span class="label">Name</span><span>${escapeHtml(item.name)}</span></div><button data-copy="${escapeHtml(item.name)}">Kopieren</button></div>
            <div class="row"><div><span class="label">Spawnname</span><code>${escapeHtml(item.spawn)}</code></div><button data-copy="${escapeHtml(item.spawn)}">Kopieren</button></div>
          </div>
        </article>`).join("");
      empty.style.display = filtered.length ? "none" : "block";
    }

    search.addEventListener("input", event => render(event.target.value));
    tabs.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      renderTabs();
      render();
    });
    function openLightbox(trigger) {
      const image = trigger.dataset.image;
      lightboxTitle.textContent = trigger.dataset.title;
      lightboxContent.innerHTML = /^https?:|^data:image\//i.test(image)
        ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(trigger.dataset.title)}">`
        : escapeHtml(image);
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
      lightboxClose.focus();
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }
    list.addEventListener("click", event => {
      const image = event.target.closest(".icon");
      if (image) openLightbox(image);
    });
    list.addEventListener("keydown", event => {
      const image = event.target.closest(".icon");
      if (image && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        openLightbox(image);
      }
    });
    lightboxClose.addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape" && lightbox.classList.contains("open")) closeLightbox(); });
    list.addEventListener("click", async event => {
      const button = event.target.closest("button[data-copy]");
      if (!button) return;
      try {
        await navigator.clipboard.writeText(button.dataset.copy);
      } catch {
        const area = document.createElement("textarea"); area.value = button.dataset.copy;
        document.body.append(area); area.select(); document.execCommand("copy"); area.remove();
      }
      toast.textContent = `„${button.dataset.copy}“ kopiert`;
      toast.classList.add("show"); clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    });
    renderTabs();
    render();
  </script>
